services:
  mysql:
    image: mysql:8.4
    container_name: ai-planner-mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build:
      context: ./ai-planner-backend
    container_name: ai-planner-backend

    restart: always

    depends_on:
      - mysql
    
    ports:
      - "8080:8080"

    environment:
        DB_URL: ${MYSQL_URL}
        DB_USERNAME: ${DB_USERNAME}
        DB_PASSWORD: ${DB_PASSWORD}
        GEMINI_API_KEY: ${GEMINI_API_KEY}

  frontend:
    build: 
      context: ./ai-planner-frontend
    container_name: ai-planner-frontend

    restart: always

    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql-data: